<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Jessie - 个人主页</title>
  <style>
    /* 让 body 占满全屏，并移除默认边距 */
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #faf6f0; /* 温暖的米白底 */
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      position: relative; /* 让画布可以定位 */
      overflow: hidden; /* 防止滚动条 */
    }
    /* 内容居中，并置于顶层 */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.7); /* 半透明白色毛玻璃效果，增加文字可读性 */
      backdrop-filter: blur(4px);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 3.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #3d3d3d;
    }
    p {
      font-size: 1.25rem;
      color: #6b6b6b;
      margin-bottom: 1.5rem;
    }
    a {
      color: #6c8c9c;
      text-decoration: none;
      margin: 0 0.5rem;
      transition: color 0.3s;
    }
    a:hover {
      color: #4a6a7a;
      text-decoration: underline;
    }
    /* 编织动画画布：铺满全屏，位于内容下方 */
    #knitting-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none; /* 让鼠标事件可以穿透画布，不影响点击链接 */
    }
  </style>
</head>
<body>
  <!-- 动态编织画布 -->
  <canvas id="knitting-canvas"></canvas>

  <!-- 你的个人介绍内容 -->
  <div class="content">
    <h1>Hi, I'm Jessie</h1>
    <p>设计师 / 正在 vibe coding 中</p>
    <div>
      <a href="https://github.com/JessieLi926" target="_blank">GitHub</a>
      <span style="color: #ccc; margin: 0 0.25rem;">|</span>
      <a href="#">作品集（待更新）</a>
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('knitting-canvas');
      const ctx = canvas.getContext('2d');

      // 设置画布尺寸为窗口大小
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // --- 编织动画参数 ---
      const lines = []; // 存储“毛线”的轨迹点
      const maxLines = 30; // 轨迹长度（线拖尾的长度）
      let progress = 0; // 进度 0-1

      // 颜色配置（小清新风格）
      const colors = [
        'rgba(210, 180, 140, 0.6)', // 米色
        'rgba(180, 160, 130, 0.5)', 
        'rgba(200, 170, 150, 0.4)',
        'rgba(220, 190, 160, 0.3)'
      ];

      // 初始化：生成一些随机的起始点，让画面一开始就有线条
      function initLines() {
        for (let i = 0; i < maxLines; i++) {
          lines.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
          });
        }
      }
      initLines();

      // --- 核心动画循环 ---
      function draw() {
        // 1. 用半透明背景覆盖，制造“拖尾”或“逐渐消失”的效果
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 绘制淡淡的静态编织网格作为底色（可选的）
        drawStaticTexture();

        // 2. 更新线条位置：模拟“穿梭”
        // 使用正弦波让线条在水平方向来回移动，同时缓慢向下移动，形成编织感
        const time = Date.now() / 3000; // 控制速度
        
        // 用进度控制整体移动阶段
        progress = (progress + 0.002) % 1; // 缓慢循环

        // 更新每个点的位置
        // 为了让编织效果更丰富，我们让线条沿着波浪路径移动
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          // 每个点有细微不同的相位，形成波浪
          const phase = i / lines.length * Math.PI * 4;
          // 水平移动：正弦波左右摆动，幅度为画布宽度的 20%
          const offsetX = Math.sin(time + phase) * canvas.width * 0.15;
          // 垂直移动：以不同速度向下，模拟编织的经纬线
          // 加上一些随机的垂直偏移，更有手工感
          const offsetY = Math.cos(time * 0.8 + i) * canvas.height * 0.05 + canvas.height * 0.1 * Math.sin(time * 0.5 + i * 0.5);
          
          // 基础位置是沿着一个方向缓慢移动
          const baseX = (i / maxLines) * canvas.width * 1.2 - canvas.width * 0.1;
          const baseY = (i / maxLines) * canvas.height * 0.8 + canvas.height * 0.1;
          
          // 最终位置 = 基础位置 + 动态偏移
          line.x = baseX + offsetX;
          line.y = baseY + offsetY;
          
          // 让部分线条在边缘循环，形成无限编织感
          if (line.x > canvas.width) line.x = -canvas.width * 0.1;
          if (line.x < -canvas.width * 0.1) line.x = canvas.width;
          if (line.y > canvas.height) line.y = -canvas.height * 0.1;
          if (line.y < -canvas.height * 0.1) line.y = canvas.height;
        }

        // 3. 绘制“毛线”
        // 绘制线条之间的连接，形成网络或编织的视觉效果
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 绘制主要穿梭线（较亮）
        for (let i = 0; i < lines.length - 1; i++) {
          const p1 = lines[i];
          const p2 = lines[i + 1];
          // 根据位置选择颜色，形成渐变
          const colorIndex = Math.floor((i / lines.length) * colors.length) % colors.length;
          ctx.strokeStyle = colors[colorIndex];
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }

        // 绘制一些横向的“编织线”，增加层次感
        ctx.lineWidth = 1.5;
        for (let i = 0; i < lines.length - 2; i+=2) {
          const p1 = lines[i];
          const p2 = lines[i+2];
          ctx.strokeStyle = 'rgba(190, 170, 150, 0.25)';
          ctx.beginPath();
          ctx.moveTo(p1.x - 10, p1.y + 20);
          ctx.lineTo(p2.x + 10, p2.y - 20);
          ctx.stroke();
        }

        // 在线的节点上画一些小点，模拟毛线的质感
        for (let i = 0; i < lines.length; i+=2) {
          const p = lines[i];
          ctx.fillStyle = 'rgba(180, 150, 120, 0.3)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }

      // 绘制静态编织纹理（极淡的底纹）
      function drawStaticTexture() {
        ctx.strokeStyle = 'rgba(200, 180, 160, 0.08)';
        ctx.lineWidth = 0.5;
        const step = 30;
        // 垂直线
        for (let x = 0; x < canvas.width; x += step) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        // 水平线
        for (let y = 0; y < canvas.height; y += step) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }

      // 启动动画
      draw();

      // 窗口大小变化时重置画布尺寸，并重新初始化线条位置
      window.addEventListener('resize', () => {
        resizeCanvas();
        // 重新分布线条位置以适应新尺寸
        for (let i = 0; i < lines.length; i++) {
          lines[i] = {
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
          };
        }
      });

    })();
  </script>
</body>
</html>
