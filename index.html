<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jessie - 正在编织中</title>
  <style>
    /* 重置样式，让画布铺满全屏 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background-color: #faf6f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
      overflow: hidden;
    }
    /* 内容卡片 - 毛玻璃效果，位于动画之上 */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 3rem 4rem;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.06);
      border: 1px solid rgba(255,255,255,0.3);
    }
    h1 {
      font-size: 4rem;
      font-weight: 600;
      color: #3d3d3d;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 1.25rem;
      color: #6b6b6b;
      margin-bottom: 1.5rem;
      font-weight: 300;
    }
    .links a {
      color: #7a8f9c;
      text-decoration: none;
      margin: 0 0.75rem;
      font-size: 1rem;
      transition: all 0.2s;
      border-bottom: 1px solid transparent;
    }
    .links a:hover {
      color: #4a6a7a;
      border-bottom-color: #b0c8d4;
    }
    .links span { color: #d5d5d5; }
    
    /* 编织画布：位于底层 */
    #knitting-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      pointer-events: none; /* 不干扰点击 */
    }
  </style>
</head>
<body>
  <!-- 动态编织画布 -->
  <canvas id="knitting-canvas"></canvas>

  <!-- 个人介绍 -->
  <div class="content">
    <h1>Hi, I'm Jessie</h1>
    <p>设计师 / 正在 vibe coding 中</p>
    <div class="links">
      <a href="https://github.com/JessieLi926" target="_blank">GitHub</a>
      <span>|</span>
      <a href="#">作品集（待更新）</a>
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('knitting-canvas');
      if (!canvas) {
        console.error('找不到画布！');
        return;
      }
      const ctx = canvas.getContext('2d');
      let width, height;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }
      window.addEventListener('resize', resize);
      resize();

      // 线条系统
      const numLines = 35;
      const points = [];
      // 为每条线分配不同的速度因子和相位
      for (let i = 0; i < numLines; i++) {
        points.push({
          // 在画布范围内随机分布起始点
          x: Math.random() * width,
          y: Math.random() * height,
          speed: 0.2 + Math.random() * 0.3, // 速度略有差异
          phase: Math.random() * Math.PI * 2,
          offset: Math.random() * 100
        });
      }

      // 颜色盘 - 小清新毛线色
      const palette = [
        'rgba(210, 180, 140, 0.7)',
        'rgba(195, 170, 145, 0.6)',
        'rgba(180, 160, 135, 0.5)',
        'rgba(220, 195, 165, 0.4)',
        'rgba(200, 175, 150, 0.3)'
      ];

      let time = 0;

      function draw() {
        time += 0.008;
        // 清空画布 - 使用半透明清除实现拖尾效果
        ctx.clearRect(0, 0, width, height);
        
        // 绘制极淡的底纹网格
        ctx.strokeStyle = 'rgba(200, 185, 170, 0.08)';
        ctx.lineWidth = 0.5;
        const step = 40;
        for (let x = step; x < width; x += step) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let y = step; y < height; y += step) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        // 更新点位置并绘制线条
        // 让点沿着波浪路径移动，模拟编织的穿梭
        const centerX = width / 2;
        const centerY = height / 2;
        
        // 先更新所有点的位置
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          // 使用正弦波让点在水平方向来回移动，同时缓慢向下，循环
          const waveX = Math.sin(time * p.speed * 1.5 + p.phase) * width * 0.3;
          const waveY = Math.cos(time * p.speed * 1.2 + p.phase * 1.3) * height * 0.1;
          
          // 基础路径：从左上向右下缓慢移动，并循环
          const baseX = (i / points.length) * width * 1.5 - width * 0.25 + time * 20 * p.speed;
          const baseY = (i / points.length) * height * 0.7 + height * 0.15 + Math.sin(time * 0.5 + i) * 20;
          
          // 计算新位置，并让超出边界的点循环到另一边
          let newX = baseX + waveX;
          let newY = baseY + waveY;
          
          // 水平循环
          if (newX > width + 50) newX = -50;
          if (newX < -50) newX = width + 50;
          // 垂直循环
          if (newY > height + 50) newY = -50;
          if (newY < -50) newY = height + 50;
          
          p.x = newX;
          p.y = newY;
        }

        // 按x坐标排序，让线条更有序地连接
        const sorted = [...points].sort((a, b) => a.x - b.x);

        // 绘制主线条（经线）
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        for (let i = 0; i < sorted.length - 1; i++) {
          const p1 = sorted[i];
          const p2 = sorted[i+1];
          // 根据位置选择颜色
          const colorIdx = Math.floor((i / sorted.length) * palette.length) % palette.length;
          ctx.strokeStyle = palette[colorIdx];
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }

        // 绘制额外的纬线（横向交织），增加编织感
        ctx.lineWidth = 1.2;
        for (let i = 0; i < sorted.length - 3; i+=3) {
          const p1 = sorted[i];
          const p2 = sorted[i+3];
          ctx.strokeStyle = 'rgba(180, 160, 140, 0.2)';
          ctx.beginPath();
          ctx.moveTo(p1.x - 15, p1.y + 10);
          ctx.lineTo(p2.x + 15, p2.y - 10);
          ctx.stroke();
        }

        // 在一些节点上画小点，模拟毛线球质感
        for (let i = 0; i < sorted.length; i+=2) {
          const p = sorted[i];
          ctx.fillStyle = 'rgba(180, 155, 130, 0.25)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }

      draw();

      // 窗口大小变化时重置
      window.addEventListener('resize', () => {
        resize();
        // 重新分布点，适应新尺寸
        for (let i = 0; i < points.length; i++) {
          points[i].x = Math.random() * width;
          points[i].y = Math.random() * height;
        }
      });

    })();
  </script>
</body>
</html>
