<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jessie · 宣纸</title>
  <!-- 使用 Google Fonts 的书法风格字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      /* 宣纸底色：温暖的米黄，带纤维纹理 */
      background-color: #f7f2e9;
      background-image: 
        /* 模拟宣纸的帘纹 */
        repeating-linear-gradient(90deg, rgba(200, 185, 170, 0.08) 0px, rgba(200, 185, 170, 0.08) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(0deg, rgba(200, 185, 170, 0.05) 0px, rgba(200, 185, 170, 0.05) 1px, transparent 1px, transparent 8px),
        /* 边缘轻微做旧 */
        radial-gradient(ellipse at 20% 30%, rgba(220, 200, 180, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(180, 160, 140, 0.1) 0%, transparent 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Noto Serif SC", "华文楷体", "KaiTi", "楷体", serif;
      position: relative;
      padding: 2rem;
    }
    
    /* 内容卡片 - 更像一张宣纸 */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 4rem 5rem;
      background: rgba(247, 242, 233, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 8px;
      box-shadow: 0 4px 40px rgba(100, 80, 60, 0.08);
      border: 1px solid rgba(220, 200, 180, 0.3);
      max-width: 700px;
      width: 100%;
    }
    
    /* 毛笔书法标题 */
    h1 {
      font-family: "Ma Shan Zheng", "华文楷体", "KaiTi", cursive;
      font-size: 4.8rem;
      font-weight: 400;
      color: #4a3a2a;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 3px rgba(200, 180, 160, 0.2);
      /* 模拟墨迹的轻微晕染 */
      position: relative;
      display: inline-block;
    }
    /* 为标题增加一点墨迹飞白装饰 */
    h1::after {
      content: '';
      position: absolute;
      bottom: 5px;
      right: -20px;
      width: 12px;
      height: 12px;
      background: radial-gradient(circle, rgba(80, 65, 50, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    h1::before {
      content: '';
      position: absolute;
      top: -5px;
      left: -15px;
      width: 8px;
      height: 8px;
      background: radial-gradient(circle, rgba(80, 65, 50, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    
    .subtitle {
      font-size: 1.4rem;
      font-weight: 300;
      color: #7a6a5a;
      letter-spacing: 0.4em;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(200, 180, 160, 0.2);
      position: relative;
    }
    /* 模仿毛笔画的装饰线 */
    .subtitle::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(100, 80, 60, 0.3), transparent);
    }
    
    .links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .links a {
      font-family: "Noto Serif SC", serif;
      font-weight: 300;
      color: #8a7a6a;
      text-decoration: none;
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      transition: all 0.4s;
      padding: 0.25rem 0.5rem;
      border-bottom: 1px solid transparent;
      position: relative;
    }
    .links a:hover {
      color: #4a3a2a;
      border-bottom-color: #b0a090;
      transform: translateY(-1px);
    }
    /* 为链接增加毛笔的飞白点缀 */
    .links a::before {
      content: '·';
      color: #c0b0a0;
      margin-right: 8px;
      font-weight: 700;
    }
    .links a:first-child::before {
      content: '';
      margin: 0;
    }
    
    /* 静态装饰笔触 (SVG风格) - 放在角落 */
    .decorative-brush {
      position: fixed;
      z-index: 0;
      opacity: 0.08;
      pointer-events: none;
    }
    .decorative-brush-1 {
      top: 10%;
      left: 5%;
      width: 120px;
      height: 120px;
      border-radius: 50% 0 50% 0;
      background: radial-gradient(circle at 30% 30%, #8a7a6a, transparent 70%);
      filter: blur(20px);
    }
    .decorative-brush-2 {
      bottom: 15%;
      right: 8%;
      width: 150px;
      height: 80px;
      border-radius: 0 50% 0 50%;
      background: radial-gradient(circle at 70% 70%, #7a6a5a, transparent 70%);
      filter: blur(25px);
      transform: rotate(-15deg);
    }
    /* 极简的毛笔线条装饰 */
    .ink-line {
      position: fixed;
      z-index: 0;
      border-bottom: 1px solid rgba(100, 80, 60, 0.06);
      width: 200px;
      transform: rotate(-5deg);
      pointer-events: none;
    }
    .ink-line-1 { top: 20%; left: -30px; width: 150px; }
    .ink-line-2 { bottom: 25%; right: -20px; width: 180px; transform: rotate(8deg); }

    /* 移动端适配 */
    @media (max-width: 600px) {
      .content { padding: 2.5rem 1.5rem; }
      h1 { font-size: 3.6rem; }
      .subtitle { font-size: 1.1rem; letter-spacing: 0.2em; }
      .links a { font-size: 0.95rem; letter-spacing: 0.1em; }
      .links { gap: 0.8rem; }
    }
  </style>
</head>
<body>
  <!-- 静态装饰元素 -->
  <div class="decorative-brush decorative-brush-1"></div>
  <div class="decorative-brush decorative-brush-2"></div>
  <div class="ink-line ink-line-1"></div>
  <div class="ink-line ink-line-2"></div>

  <!-- 个人介绍卡片 -->
  <div class="content">
    <h1>Hi, I'm Jessie</h1>
    <div class="subtitle">设计师 · 正在 vibe coding 中</div>
    <div class="links">
      <a href="https://github.com/JessieLi926" target="_blank">GitHub</a>
      <a href="#">作品集（待更新）</a>
    </div>
  </div>
</body>
</html>
